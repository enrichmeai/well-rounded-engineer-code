[project]
name = "wre-testing"
version = "1.0.0"
description = "Unit, API, browser and load tests against one tiny app"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "browser: drives a real browser with Playwright (needs a Chromium install)",
]
